<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Cumpleaños María</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020208;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Título principal neón */
    .title-banner {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      width: 100%;
      pointer-events: none;
    }

    .title-banner h1 {
      color: #ffffff;
      font-size: 3.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: capitalize;
      text-shadow: 
        0 0 10px #fff,
        0 0 20px #ff69b4,
        0 0 30px #ff1493,
        0 0 50px #ff1493,
        0 0 80px #ff1493;
      animation: glow 2s infinite alternate ease-in-out;
    }

    @keyframes glow {
      0% {
        text-shadow: 
          0 0 10px #fff,
          0 0 20px #ffd700,
          0 0 30px #ff69b4,
          0 0 40px #ff1493;
      }
      100% {
        text-shadow: 
          0 0 15px #fff,
          0 0 25px #ff1493,
          0 0 45px #ff69b4,
          0 0 70px #ff1493,
          0 0 90px #ff1493;
      }
    }

    .instructions {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.85rem;
      z-index: 10;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .title-banner h1 {
        font-size: 2.2rem;
      }
    }
  </style>
  <!-- Three.js y OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div class="title-banner">
    <h1>Feliz cumpleaños María 🌷</h1>
  </div>

  <div id="canvas-container"></div>
  <div class="instructions">Usa el ratón para mover la galaxia y hacer zoom</div>

  <script>
    // ------------------- ESCENA Y CÁMARA 3D -------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020208, 0.0004);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 160, 260);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // ------------------- ILUMINACIÓN REALISTA -------------------
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const planetLight = new THREE.PointLight(0xffb700, 2.5, 400);
    planetLight.position.set(0, 0, 0);
    scene.add(planetLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(100, 100, 50);
    scene.add(dirLight);

    // ------------------- GENERADOR DE TEXTURA PLANETARIA -------------------
    function generatePlanetTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#ff8c00');
      grad.addColorStop(0.2, '#ffd700');
      grad.addColorStop(0.5, '#ff4500');
      grad.addColorStop(0.8, '#ff8c00');
      grad.addColorStop(1, '#e65100');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      for (let i = 0; i < 400; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const rx = Math.random() * 120 + 20;
        const ry = Math.random() * 12 + 2;
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, Math.random() * 0.2 - 0.1, 0, Math.PI * 2);
        ctx.fill();
      }

      return new THREE.CanvasTexture(canvas);
    }

    // ------------------- PLANETA CENTRAL REALISTA -------------------
    const planetGroup = new THREE.Group();
    scene.add(planetGroup);

    const planetTexture = generatePlanetTexture();
    const planetGeo = new THREE.SphereGeometry(18, 64, 64);
    const planetMat = new THREE.MeshStandardMaterial({
      map: planetTexture,
      roughness: 0.35,
      metalness: 0.1,
      emissive: 0xff5500,
      emissiveIntensity: 0.35
    });
    const planet = new THREE.Mesh(planetGeo, planetMat);
    planet.renderOrder = 10;
    planetGroup.add(planet);

    const atmosGeo = new THREE.SphereGeometry(19.2, 64, 64);
    const atmosMat = new THREE.MeshBasicMaterial({
      color: 0xffa500,
      transparent: true,
      opacity: 0.18,
      side: THREE.BackSide
    });
    const atmosphere = new THREE.Mesh(atmosGeo, atmosMat);
    atmosphere.renderOrder = 11;
    planetGroup.add(atmosphere);

    function createPlanetRings() {
      const ringCanvas = document.createElement('canvas');
      ringCanvas.width = 512;
      ringCanvas.height = 1;
      const ctx = ringCanvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 512, 0);
      grad.addColorStop(0, 'rgba(255, 215, 0, 0)');
      grad.addColorStop(0.2, 'rgba(255, 215, 0, 0.8)');
      grad.addColorStop(0.5, 'rgba(255, 105, 180, 0.5)');
      grad.addColorStop(0.8, 'rgba(255, 215, 0, 0.7)');
      grad.addColorStop(1, 'rgba(255, 215, 0, 0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 1);

      const ringTex = new THREE.CanvasTexture(ringCanvas);
      const ringGeo = new THREE.RingGeometry(22, 38, 128);
      
      const pos = ringGeo.attributes.position;
      const uv = ringGeo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const distance = Math.sqrt(x * x + y * y);
        uv.setX(i, (distance - 22) / (38 - 22));
      }

      const ringMat = new THREE.MeshBasicMaterial({
        map: ringTex,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.85
      });

      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.rotation.x = Math.PI / 2.3;
      ringMesh.renderOrder = 12;
      return ringMesh;
    }

    planetGroup.add(createPlanetRings());

    // ------------------- GALAXIA Y NEBULOSA EN TODA LA PANTALLA -------------------
    const galaxyGroup = new THREE.Group();
    scene.add(galaxyGroup);

    function createNebulaTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      grad.addColorStop(0, 'rgba(255, 105, 180, 0.4)');
      grad.addColorStop(0.35, 'rgba(138, 43, 226, 0.22)');
      grad.addColorStop(0.7, 'rgba(0, 191, 255, 0.1)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);

      return new THREE.CanvasTexture(canvas);
    }

    const nebulaTexture = createNebulaTexture();
    const numNebulaClouds = 250;

    for (let i = 0; i < numNebulaClouds; i++) {
      const nebulaMat = new THREE.SpriteMaterial({
        map: nebulaTexture,
        transparent: true,
        blending: THREE.AdditiveBlending,
        opacity: Math.random() * 0.28 + 0.1,
        depthWrite: false
      });
      const nebula = new THREE.Sprite(nebulaMat);

      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      const r = Math.pow(Math.random(), 0.6) * 320 + 45;

      nebula.position.set(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.sin(phi) * Math.sin(theta) * 0.5,
        r * Math.cos(phi)
      );

      const scale = Math.random() * 90 + 40;
      nebula.scale.set(scale, scale, 1);
      galaxyGroup.add(nebula);
    }

    // ------------------- ESTRELLAS BLANCAS CON PARPADEO -------------------
    const particleCount = 12000;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    const twinkleSpeeds = new Float32Array(particleCount);
    const twinkleOffsets = new Float32Array(particleCount);
    const baseSizes = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      const r = Math.pow(Math.random(), 1.5) * 230 + 15;
      const theta = Math.random() * Math.PI * 2;
      const y = (Math.random() - 0.5) * (20 * (1 - r / 250));

      positions[i * 3] = Math.cos(theta) * r;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = Math.sin(theta) * r;

      colors[i * 3] = 1.0; 
      colors[i * 3 + 1] = 1.0; 
      colors[i * 3 + 2] = 1.0;

      twinkleSpeeds[i] = Math.random() * 4 + 1.5;
      twinkleOffsets[i] = Math.random() * Math.PI * 2;
      baseSizes[i] = Math.random() * 1.3 + 0.6;
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    particleGeo.setAttribute('twinkleSpeed', new THREE.BufferAttribute(twinkleSpeeds, 1));
    particleGeo.setAttribute('twinkleOffset', new THREE.BufferAttribute(twinkleOffsets, 1));
    particleGeo.setAttribute('baseSize', new THREE.BufferAttribute(baseSizes, 1));

    const twinkleVertexShader = `
      attribute float twinkleSpeed;
      attribute float twinkleOffset;
      attribute float baseSize;
      uniform float uTime;
      varying vec3 vColor;

      void main() {
        vColor = color;
        float twinkle = sin(uTime * twinkleSpeed + twinkleOffset);
        float sizeFactor = 0.2 + 0.8 * (twinkle * 0.5 + 0.5);

        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        gl_PointSize = (baseSize * sizeFactor) * (300.0 / -mvPosition.z);
      }
    `;

    const twinkleFragmentShader = `
      varying vec3 vColor;

      void main() {
        float dist = length(gl_PointCoord - vec2(0.5));
        if (dist > 0.5) discard;
        float alpha = smoothstep(0.5, 0.05, dist);
        gl_FragColor = vec4(vColor, alpha * 0.95);
      }
    `;

    const particleMat = new THREE.ShaderMaterial({
      vertexShader: twinkleVertexShader,
      fragmentShader: twinkleFragmentShader,
      uniforms: { uTime: { value: 0.0 } },
      vertexColors: true,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const galaxyParticles = new THREE.Points(particleGeo, particleMat);
    galaxyGroup.add(galaxyParticles);

    // ------------------- TULIPANES -------------------
    function createTulipTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.beginPath();
      ctx.moveTo(64, 75);
      ctx.quadraticCurveTo(68, 95, 64, 115);
      ctx.strokeStyle = '#43a047';
      ctx.lineWidth = 5;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(54, 96, 7, 16, -0.4, 0, Math.PI * 2);
      ctx.fillStyle = '#66bb6a';
      ctx.fill();

      ctx.fillStyle = '#d81b60';
      ctx.beginPath();
      ctx.ellipse(50, 52, 14, 26, -0.25, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(78, 52, 14, 26, 0.25, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ff4081';
      ctx.beginPath();
      ctx.ellipse(64, 50, 16, 28, 0, 0, Math.PI * 2);
      ctx.shadowColor = '#ff80ab';
      ctx.shadowBlur = 8;
      ctx.fill();

      return new THREE.CanvasTexture(canvas);
    }

    const tulipTexture = createTulipTexture();
    const tulipGroup = new THREE.Group();
    galaxyGroup.add(tulipGroup);

    const numTulips = 140;
    for (let i = 0; i < numTulips; i++) {
      const spriteMat = new THREE.SpriteMaterial({ map: tulipTexture, transparent: true });
      const sprite = new THREE.Sprite(spriteMat);

      const r = Math.random() * 200 + 30;
      const angle = Math.random() * Math.PI * 2;
      const y = (Math.random() - 0.5) * 16;

      sprite.position.set(Math.cos(angle) * r, y, Math.sin(angle) * r);
      sprite.scale.set(5.0, 5.0, 1);
      tulipGroup.add(sprite);
    }

    // ------------------- FRASES EN 6 ÓRBITAS (6 FRASES POR ÓRBITA = 36 FRASES) -------------------
    const orbitPhrases = [
      // Órbita 1 (Interior)
      ["Eres Luz ✨", "Te quiero mucho 💖", "Sigue brillando 🌟", "¡El mejor día! 🎉", "Un abrazo enorme 🤗", "Mi favorita 💕"],
      // Órbita 2
      ["Deseos infinitos 🌠", "Siempre sonríe 😊", "Un año de magia ✨", "¡Felicidades María! 🎂", "Sé muy feliz 🌺", "Gracias por existir 💫"],
      // Órbita 3
      ["El universo celebra 🌌", "Más que mil estrellas 💫", "Sueños al infinito 🚀", "Universo y magia 🪐", "Infinitas alegrías 🌸", "Eres increíble 🌷"],
      // Órbita 4
      ["Un año radiante ✨", "Vive cada instante 💖", "Brillas con alma 🌟", "Sonrisas eternas 😊", "Día maravilloso 🎉", "Amor y luz 💕"],
      // Órbita 5
      ["Abrazos al cielo 🌌", "Magia sin fin 🌠", "Momento inolvidable 🎂", "Sigue tus sueños 🚀", "Tu luz es única 🌺", "Siempre especial 💫"],
      // Órbita 6 (Exterior)
      ["Pide un deseo ✨", "Un año grandioso 🎉", "Felicidad pura 😊", "Brillo infinito 🪐", "Te queremos María 💖", "Celebra en grande 🌸"]
    ];

    function createPhraseSprite(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.font = 'Bold 28px "Segoe UI", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 10;
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(38, 9.5, 1);
      return sprite;
    }

    // Dibujar las 6 órbitas e insertar exactamente 6 frases en cada una
    for (let orbitIndex = 0; orbitIndex < 6; orbitIndex++) {
      const radius = (orbitIndex + 1) * 32;

      // Línea de la órbita
      const orbitGeo = new THREE.RingGeometry(radius - 0.3, radius + 0.3, 128);
      const orbitMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.15
      });
      const orbitMesh = new THREE.Mesh(orbitGeo, orbitMat);
      orbitMesh.rotation.x = Math.PI / 2;
      galaxyGroup.add(orbitMesh);

      // Distribuir 6 frases uniformemente (60 grados = PI/3)
      const phrasesInOrbit = orbitPhrases[orbitIndex];
      const angleStep = (Math.PI * 2) / 6;
      const orbitOffsetAngle = orbitIndex * 0.3; // Offset para no alinear todas las órbitas en línea recta

      phrasesInOrbit.forEach((phraseText, i) => {
        const sprite = createPhraseSprite(phraseText);
        const angle = i * angleStep + orbitOffsetAngle;

        sprite.position.set(
          Math.cos(angle) * radius,
          (Math.random() - 0.5) * 6 + 2, // Leve elevación para efecto flotante
          Math.sin(angle) * radius
        );

        galaxyGroup.add(sprite);
      });
    }

    // ------------------- BUCLE DE ANIMACIÓN -------------------
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // Parpadeo de estrellas
      particleMat.uniforms.uTime.value = elapsedTime;

      // Rotación del planeta central
      planetGroup.rotation.y = elapsedTime * 0.12;

      // Rotación suave de la galaxia completa
      galaxyGroup.rotation.y = elapsedTime * 0.05;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
